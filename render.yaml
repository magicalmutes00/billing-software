services:
  # Backend API (FastAPI) — Render free web tier
  - type: web
    name: billing-backend
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        value: change-me-to-a-long-random-string-at-least-32-bytes
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: PORTAL_TOKEN_HOURS
        value: "24"
      - key: PAYMENT_PROVIDER
        value: stub
      - key: WEBHOOK_SECRET
        value: change-me-to-a-long-random-webhook-secret
      - key: STORAGE_DIR
        value: ./storage
    healthCheckPath: /health
    autoDeploy: true

  # Frontend (nginx serving Vite build, proxying /api to backend)
  - type: web
    name: billing-frontend
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeploy: true
