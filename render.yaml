services:
  # Managed PostgreSQL on Render
  - type: postgresql
    name: billing-db
    plan: starter
    databaseName: billing
    user: billing

  # Managed Redis on Render
  - type: redis
    name: billing-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

  # Backend API (FastAPI)
  - type: web
    name: billing-backend
    env: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        # AFTER creating the billing-db service on Render, copy its connection string
        # from the Render dashboard, replace "postgresql://" with "postgresql+asyncpg://",
        # and set it here as the DATABASE_URL value.
        value: ""
        sync: false
      - key: APP_DATABASE_URL
        # Optional: set only if you want a separate non-owner RLS role.
        # Otherwise unset and the app uses DATABASE_URL for everything.
        value: ""
        sync: false
      - key: JWT_SECRET
        generate: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: PORTAL_TOKEN_HOURS
        value: "24"
      - key: PAYMENT_PROVIDER
        value: stub
      - key: WEBHOOK_SECRET
        generate: true
      - key: CORS_ORIGINS
        # Set this to your frontend URL after it is deployed, e.g.
        # https://billing-frontend.onrender.com
        # (Optional: the frontend proxies /api through nginx, so same-origin calls
        #  don't need CORS. Set this only if you call the backend API directly.)
        value: ""
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: billing-redis
          property: connectionString
      - key: STORAGE_DIR
        value: ./storage
    healthCheckPath: /health
    autoDeploy: true

  # Frontend (nginx serving Vite build, proxying /api to backend)
  - type: web
    name: billing-frontend
    env: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: billing-backend
          property: url
    autoDeploy: true
