services:
  # Backend API (FastAPI) — Render free web tier
  - type: web
    name: billing-backend
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        # SET THIS: Your Neon connection string with postgresql+asyncpg://
        # Example: postgresql+asyncpg://neondb_owner:npg_xxx@ep-xxx.aws.neon.tech/neondb?sslmode=require&channel_binding=require
        value: ""
        sync: false
      - key: APP_DATABASE_URL
        # Optional: separate non-owner RLS role. Leave empty to use DATABASE_URL for everything.
        value: ""
        sync: false
      - key: JWT_SECRET
        generate: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: PORTAL_TOKEN_HOURS
        value: "24"
      - key: PAYMENT_PROVIDER
        value: stub
      - key: WEBHOOK_SECRET
        generate: true
      - key: CORS_ORIGINS
        # Set to your frontend URL after deploy, e.g. https://billing-frontend.onrender.com
        value: ""
        sync: false
      - key: STORAGE_DIR
        value: ./storage
      - key: REDIS_URL
        # Not required by the app. Set only if you add Redis later.
        value: ""
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # Frontend (nginx serving Vite build, proxying /api to backend)
  - type: web
    name: billing-frontend
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: billing-backend
          property: url
    autoDeploy: true
